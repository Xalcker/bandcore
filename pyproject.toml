[project]
name = "bandcore"
version = "0.1.0"
description = "Herramientas compartidas de NESBand, GBBand, GENBand y NGBand: lectura de VGM y detección del juego destino"
requires-python = ">=3.11"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
band = "bandcore.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bandcore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
